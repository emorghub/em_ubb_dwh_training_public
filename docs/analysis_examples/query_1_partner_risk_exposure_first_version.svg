<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="940" viewBox="0 0 1560 940" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Partner risk exposure query (first version) relationships</title>
  <desc id="diagram-description">Five tables, with CTRL_LOAD used twice as cl_ph and cl_lh, connected by the query's inner and left joins, with cardinalities at each endpoint, the point-in-time and load filters, and the HAVING filter.</desc>
  <defs>
    <style>
      .table { fill:#ffffff; stroke:#334155; stroke-width:2; rx:10; }
      .header { fill:#1e293b; }
      .title { fill:#ffffff; font:700 18px Arial, sans-serif; }
      .field { fill:#0f172a; font:14px Consolas, monospace; }
      .pk { fill:#0369a1; font:700 14px Consolas, monospace; }
      .fk { fill:#7c3aed; font:700 14px Consolas, monospace; }
      .line { stroke:#64748b; stroke-width:2; fill:none; }
      .outer { stroke:#64748b; stroke-width:2; fill:none; stroke-dasharray:8 5; }
      .label { fill:#475569; font:13px Arial, sans-serif; }
      .filter { fill:#9a3412; font:13px Consolas, monospace; }
      .filter-heading { fill:#9a3412; font:700 13px Arial, sans-serif; }
      .cardinality { fill:#0f172a; font:700 14px Arial, sans-serif; }
      .heading { fill:#0f172a; font:700 22px Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1560" height="940" fill="#f8fafc"/>
  <text x="40" y="42" class="heading">Query 1 (first version) - Partner Risk Exposure &amp; Collateral Coverage</text>
  <text x="40" y="67" class="label">Solid line = INNER JOIN, dashed line = LEFT JOIN. Endpoint labels show how many rows of that table match one row of the other table. "FK" lines inside boxes are declared foreign keys.</text>

  <!-- Connectors stay in the space between table boxes. -->
  <path d="M350 180 H570" class="line"/>
  <text x="358" y="171" class="cardinality">1</text>
  <text x="528" y="171" class="cardinality">0..n</text>
  <text x="420" y="171" class="label">LOAD_ID</text>
  <text x="410" y="199" class="label">INNER JOIN</text>

  <path d="M350 555 H570" class="line"/>
  <text x="358" y="546" class="cardinality">1</text>
  <text x="528" y="546" class="cardinality">0..n</text>
  <text x="420" y="546" class="label">LOAD_ID</text>
  <text x="410" y="574" class="label">INNER JOIN</text>

  <path d="M740 362 V470" class="line"/>
  <text x="750" y="383" class="cardinality">0..1</text>
  <text x="750" y="414" class="label">PARTNER_ID only</text>
  <text x="750" y="432" class="label">INNER JOIN</text>
  <text x="750" y="461" class="cardinality">0..n</text>

  <path d="M910 588 H1040 V200 H1160" class="outer"/>
  <text x="920" y="579" class="cardinality">0..n</text>
  <text x="1114" y="191" class="cardinality">0..1</text>
  <text x="1050" y="380" class="label">LIMIT_ID + LOAD_ID</text>
  <text x="1050" y="398" class="label">LEFT JOIN</text>

  <path d="M910 640 H1160" class="outer"/>
  <text x="920" y="631" class="cardinality">0..1</text>
  <text x="1115" y="631" class="cardinality">0..n</text>
  <text x="962" y="631" class="label">LOAN_ID + LOAD_ID</text>
  <text x="995" y="662" class="label">LEFT JOIN</text>

  <!-- CTRL_LOAD cl_ph -->
  <rect x="50" y="95" width="300" height="135" class="table"/>
  <rect x="50" y="95" width="300" height="42" class="header"/>
  <text x="200" y="123" text-anchor="middle" class="title">CTRL_LOAD  (cl_ph)</text>
  <text x="68" y="163" class="pk">PK  LOAD_ID</text>
  <text x="68" y="188" class="field">BUSINESS_DATE</text>
  <text x="68" y="213" class="field">LOAD_STATUS</text>

  <rect x="50" y="250" width="300" height="110" fill="#fff7ed" stroke="#fdba74" rx="8"/>
  <text x="68" y="272" class="filter-heading">Partner load filters (WHERE)</text>
  <text x="68" y="296" class="filter">BUSINESS_DATE = DATE '2026-11-01'</text>
  <text x="68" y="317" class="filter">LOAD_STATUS IN</text>
  <text x="68" y="338" class="filter">('VALIDATED', 'COMPLETED')</text>

  <!-- CTRL_LOAD cl_lh -->
  <rect x="50" y="470" width="300" height="135" class="table"/>
  <rect x="50" y="470" width="300" height="42" class="header"/>
  <text x="200" y="498" text-anchor="middle" class="title">CTRL_LOAD  (cl_lh)</text>
  <text x="68" y="538" class="pk">PK  LOAD_ID</text>
  <text x="68" y="563" class="field">BUSINESS_DATE</text>
  <text x="68" y="588" class="field">LOAD_STATUS</text>

  <rect x="50" y="625" width="300" height="110" fill="#fff7ed" stroke="#fdba74" rx="8"/>
  <text x="68" y="647" class="filter-heading">Loan load filters (WHERE)</text>
  <text x="68" y="671" class="filter">BUSINESS_DATE = DATE '2026-11-01'</text>
  <text x="68" y="692" class="filter">LOAD_STATUS IN</text>
  <text x="68" y="713" class="filter">('VALIDATED', 'COMPLETED')</text>

  <!-- PARTNER_HIST -->
  <rect x="570" y="95" width="340" height="267" class="table"/>
  <rect x="570" y="95" width="340" height="42" class="header"/>
  <text x="740" y="123" text-anchor="middle" class="title">PARTNER_HIST  (ph)</text>
  <text x="588" y="163" class="pk">PK  PARTNER_ID + VALID_FROM</text>
  <text x="588" y="188" class="fk">FK  PARTNER_ID -&gt; PARTNER</text>
  <text x="588" y="213" class="fk">FK  LOAD_ID -&gt; CTRL_LOAD</text>
  <text x="588" y="238" class="field">PARTNER_NAME</text>
  <text x="588" y="263" class="field">CUSTOMER_SEGMENT / RISK_RATING</text>
  <path d="M585 278 H895" stroke="#fdba74" stroke-width="1"/>
  <text x="588" y="298" class="filter-heading">Point-in-time filter (WHERE)</text>
  <text x="588" y="321" class="filter">VALID_FROM &lt;= DATE '2026-11-01'</text>
  <text x="588" y="343" class="filter">VALID_TO &gt; DATE '2026-11-01'</text>

  <!-- LOAN_HIST -->
  <rect x="570" y="470" width="340" height="210" class="table"/>
  <rect x="570" y="470" width="340" height="42" class="header"/>
  <text x="740" y="498" text-anchor="middle" class="title">LOAN_HIST  (lh)</text>
  <text x="588" y="538" class="pk">PK  LOAN_ID + LOAD_ID</text>
  <text x="588" y="563" class="fk">FK  PARTNER_ID -&gt; PARTNER</text>
  <text x="588" y="588" class="fk">FK  LIMIT_ID -&gt; CREDIT_LIMIT</text>
  <text x="588" y="613" class="fk">FK  LOAD_ID -&gt; CTRL_LOAD</text>
  <text x="588" y="638" class="field">PRINCIPAL_AMT</text>
  <text x="588" y="663" class="field">OVERDUE_AMT</text>

  <rect x="570" y="700" width="340" height="65" fill="#fff7ed" stroke="#fdba74" rx="8"/>
  <text x="588" y="722" class="filter-heading">After grouping (HAVING)</text>
  <text x="588" y="748" class="filter">SUM(lh.PRINCIPAL_AMT) &gt; 100000</text>

  <!-- LIMIT_HIST -->
  <rect x="1160" y="95" width="340" height="215" class="table"/>
  <rect x="1160" y="95" width="340" height="42" class="header"/>
  <text x="1330" y="123" text-anchor="middle" class="title">LIMIT_HIST  (lim)</text>
  <text x="1178" y="163" class="pk">PK  LIMIT_ID + LOAD_ID</text>
  <text x="1178" y="188" class="fk">FK  LIMIT_ID -&gt; CREDIT_LIMIT</text>
  <text x="1178" y="213" class="fk">FK  PARTNER_ID -&gt; PARTNER</text>
  <text x="1178" y="238" class="fk">FK  LOAD_ID -&gt; CTRL_LOAD</text>
  <text x="1178" y="263" class="field">APPROVED_AMT</text>
  <text x="1178" y="288" class="field">UTILIZED_AMT</text>

  <!-- LOAN_COLLATERAL_REL_HIST -->
  <rect x="1160" y="470" width="340" height="215" class="table"/>
  <rect x="1160" y="470" width="340" height="42" class="header"/>
  <text x="1330" y="498" text-anchor="middle" class="title">LOAN_COLLATERAL_REL_HIST  (lcr)</text>
  <text x="1178" y="538" class="pk">PK  LOAN_ID + COLLATERAL_ID</text>
  <text x="1178" y="563" class="pk">    + LOAD_ID</text>
  <text x="1178" y="588" class="fk">FK  LOAN_ID -&gt; LOAN</text>
  <text x="1178" y="613" class="fk">FK  COLLATERAL_ID -&gt; COLLATERAL</text>
  <text x="1178" y="638" class="fk">FK  LOAD_ID -&gt; CTRL_LOAD</text>
  <text x="1178" y="663" class="field">ALLOCATED_VALUE_AMT</text>

  <text x="40" y="805" class="label">Query parameter: business date DATE '2026-11-01'. CTRL_LOAD is joined twice (cl_ph for the partner's load, cl_lh for the loan's load); both carry the same filters in WHERE, equal to ON for inner joins.</text>
  <text x="40" y="828" class="label">Unqualified table names: all five tables exist as tables only in UBB_CORE2 (UBB_STAGING2.CTRL_LOAD is a synonym for UBB_CORE2.CTRL_LOAD), so UBB_CORE2 is assumed.</text>
  <text x="40" y="851" class="label">Assumption: history periods do not overlap, so at most one PARTNER_HIST row per partner matches the date. The partner join has no LOAD_ID: loans of every eligible load of that date match.</text>
  <text x="40" y="874" class="label">History-to-history joins are not foreign keys; snapshot matches are not guaranteed by the exported constraints. LOAN_HIST.PARTNER_ID and LIMIT_ID are nullable.</text>
  <text x="40" y="897" class="label">Fan-out: SUMs run over the joined rows, so a loan repeats per collateral row and a limit repeats per loan; COUNT(DISTINCT loan_id) does not.</text>
  <text x="40" y="920" class="label">GROUP BY ph.partner_id, ph.partner_name, ph.customer_segment, ph.risk_rating; NVL(SUM(lcr.ALLOCATED_VALUE_AMT), 0) is the only output measure of lcr.</text>
</svg>
