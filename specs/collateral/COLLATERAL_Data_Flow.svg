<g class="node" data-node="P" data-kind="control"><rect x="40" y="160" width="273" height="94" rx="12" fill="#F2F2F2" stroke="#7A7A7A" stroke-width="2"/><text x="58" y="188" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#434343">P_BUSINESS_DATE</text>
<text x="58" y="214" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">Parameter of LOAD_DAY (IN DATE)</text>
<text x="58" y="236" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">NULL raises ORA-20001 (L88-L89)</text>
</g>
<g class="node" data-node="STG" data-kind="source"><rect x="40" y="320" width="346" height="270" rx="12" fill="#E8F6ED" stroke="#18AA49" stroke-width="3"/><text x="58" y="348" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0D5E28">STG_COLLATERAL</text>
<text x="58" y="374" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">Driving table (FROM, L126)</text>
<text x="58" y="396" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1E293B">Fields used downstream</text>
<text x="58" y="418" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">COLLATERAL_REF, LOAD_ID,</text>
<text x="58" y="440" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">COLLATERAL_TYPE, COLLATERAL_STATUS,</text>
<text x="58" y="462" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">CURRENCY_CODE, MARKET_VALUE_AMT,</text>
<text x="58" y="484" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">ELIGIBLE_VALUE_AMT, VALUATION_DATE,</text>
<text x="58" y="506" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">VALUATION_CURRENCY_CODE,</text>
<text x="58" y="528" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">ELIGIBILITY_FLAG,</text>
<text x="58" y="550" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">ELIGIBILITY_REASON_CODE,</text>
<text x="58" y="572" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">REGULATORY_HAIRCUT_PCT</text>
</g>
<g class="node" data-node="FSL" data-kind="control"><rect x="556" y="160" width="367" height="138" rx="12" fill="#F2F2F2" stroke="#7A7A7A" stroke-width="2"/><text x="574" y="188" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#434343">FIND_SOURCE_LOAD</text>
<text x="574" y="214" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">Function of package PKG_ETL_CONTROL</text>
<text x="574" y="236" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">('CBS_SIM', 'COLLATERAL', P_BUSINESS_DATE)</text>
<text x="574" y="258" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">returns the source LOAD_ID (L129)</text>
<text x="574" y="280" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">function body is not in this package</text>
</g>
<g class="node" data-node="FLT" data-kind="step"><rect x="556" y="380" width="276" height="94" rx="12" fill="#E8F6ED" stroke="#18AA49" stroke-width="2"/><text x="574" y="408" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0D5E28">Filter: selected source load</text>
<text x="574" y="434" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">STG_COLLATERAL.LOAD_ID =</text>
<text x="574" y="456" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">FIND_SOURCE_LOAD(...) (L129)</text>
</g>
<g class="node" data-node="COL" data-kind="source"><rect x="556" y="530" width="451" height="182" rx="12" fill="#EAEEFE" stroke="#2E50FA" stroke-width="3"/><text x="574" y="558" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#192C8A">COLLATERAL</text>
<text x="574" y="584" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">Identity table, only read here (L127)</text>
<text x="574" y="606" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">Match key (L128):</text>
<text x="574" y="628" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">SOURCE_SYSTEM = 'CBS_SIM' AND</text>
<text x="574" y="650" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">COLLATERAL_REF = STG_COLLATERAL.COLLATERAL_REF</text>
<text x="574" y="672" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1E293B">Field used downstream</text>
<text x="574" y="694" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">COLLATERAL_ID</text>
</g>
<g class="node" data-node="JN" data-kind="step"><rect x="1177" y="380" width="421" height="116" rx="12" fill="#FCE6F8" stroke="#E006BB" stroke-width="2"/><text x="1195" y="408" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#7B0367">Inner join</text>
<text x="1195" y="434" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">STG_COLLATERAL JOIN COLLATERAL (L127-L128)</text>
<text x="1195" y="456" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">ON COLLATERAL_REF (SOURCE_SYSTEM = 'CBS_SIM')</text>
<text x="1195" y="478" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">staged rows without a match are not selected</text>
</g>
<g class="node" data-node="MAP" data-kind="step"><rect x="1748" y="300" width="452" height="270" rx="12" fill="#FCE6F8" stroke="#E006BB" stroke-width="2"/><text x="1766" y="328" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#7B0367">Column mapping (SELECT)</text>
<text x="1766" y="354" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">COLLATERAL_ID &lt;- COLLATERAL.COLLATERAL_ID</text>
<text x="1766" y="376" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">LOAD_ID &lt;- STG_COLLATERAL.LOAD_ID</text>
<text x="1766" y="398" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">LOAN_ID &lt;- NULL</text>
<text x="1766" y="420" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">CREATED_AT &lt;- SYSTIMESTAMP</text>
<text x="1766" y="442" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1E293B">Copied as delivered (L112-L125)</text>
<text x="1766" y="464" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">COLLATERAL_TYPE, COLLATERAL_STATUS,</text>
<text x="1766" y="486" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">CURRENCY_CODE, MARKET_VALUE_AMT,</text>
<text x="1766" y="508" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">ELIGIBLE_VALUE_AMT, VALUATION_DATE,</text>
<text x="1766" y="530" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">VALUATION_CURRENCY_CODE, ELIGIBILITY_FLAG,</text>
<text x="1766" y="552" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">ELIGIBILITY_REASON_CODE, REGULATORY_HAIRCUT_PCT</text>
</g>
<g class="node" data-node="TGT" data-kind="target"><rect x="2350" y="300" width="378" height="292" rx="12" fill="#FCE6F8" stroke="#E006BB" stroke-width="3"/><text x="2368" y="328" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#7B0367">COLLATERAL_HIST</text>
<text x="2368" y="354" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">INSERT only (L96); no update, merge or delete</text>
<text x="2368" y="376" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">One row per selected, joined staged item</text>
<text x="2368" y="398" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1E293B">Output columns</text>
<text x="2368" y="420" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">COLLATERAL_ID, LOAD_ID, LOAN_ID (NULL),</text>
<text x="2368" y="442" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">COLLATERAL_TYPE, COLLATERAL_STATUS,</text>
<text x="2368" y="464" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">CURRENCY_CODE, MARKET_VALUE_AMT,</text>
<text x="2368" y="486" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">ELIGIBLE_VALUE_AMT, VALUATION_DATE,</text>
<text x="2368" y="508" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">CREATED_AT, VALUATION_CURRENCY_CODE,</text>
<text x="2368" y="530" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">ELIGIBILITY_FLAG, ELIGIBILITY_REASON_CODE,</text>
<text x="2368" y="552" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">REGULATORY_HAIRCUT_PCT</text>
<text x="2368" y="574" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">Same parameters twice fail on the primary key (L95)</text>
</g>
<g class="node" data-node="N1" data-kind="note"><rect x="40" y="840" width="2688" height="160" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="58" y="868" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#515A65">Guards (check_guards, L41-L80; called at L93 before the INSERT)</text>
<text x="58" y="894" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">AC-05 (L44-L52): P_BUSINESS_DATE is not at midnight</text>
<text x="58" y="916" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">AC-06 (L53-L61): a staged row of the selected load has no CURRENCY_CODE</text>
<text x="58" y="938" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">AC-07 (L62-L70): a staged row of the selected load has no COLLATERAL identity row</text>
<text x="58" y="960" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">AC-08 (L71-L79): COLLATERAL_HIST already has rows for the selected load</text>
<text x="58" y="982" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">A hit raises ORA-20005. Guards read data but write none.</text>
</g>
<g class="node" data-node="N2" data-kind="note"><rect x="40" y="1100" width="2688" height="94" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="58" y="1128" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#515A65">Transaction and control</text>
<text x="58" y="1154" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">SAVEPOINT at the start (L86); no COMMIT in this package; on any error ROLLBACK TO SAVEPOINT and re-raise (L133-L137).</text>
<text x="58" y="1176" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E293B">No load control record and no logging are written here (header comment L20-L21: the caller logs). The new rows carry the LOAD_ID of the selected staging load.</text>
</g>
