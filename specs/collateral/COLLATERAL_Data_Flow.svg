<svg xmlns="http://www.w3.org/2000/svg" width="2768" height="1234" viewBox="0 0 2768 1234" role="img" aria-labelledby="t d">
<title id="t">UBB_CORE2.PKG_ETL_COLLATERAL</title>
<desc id="d">Data lineage. P to FSL (date; L129 argument of FIND_SOURCE_LOAD). FSL to FLT (LOAD_ID; L129 predicate value). STG to FLT (staged rows; L126, L129 FROM + WHERE). FLT to JN (rows of load; L126-L129 filtered driving rows enter the join). COL to JN (COLLATERAL_ID; L127-L128 JOIN ... ON). JN to MAP (joined rows; L112-L128 SELECT list reads the joined rows). MAP to TGT (INSERT; L96-L125 INSERT ... SELECT).</desc>
<defs>
